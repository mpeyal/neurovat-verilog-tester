[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neurovat"
version = "0.1.0"
description = "Vectorized crossbar + LIF spiking-network simulator with pluggable synaptic device models"
readme = "src/neurovat/README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
test = ["pytest>=7"]
gui = ["dearpygui>=1.11", "matplotlib", "uharfbuzz", "freetype-py", "anthropic"]

[project.scripts]
neurovat = "neurovat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
neurovat = ["README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
