# Sensitivity to device-to-device variation (sigma of the switching time constant).
#   neurovat run configs/sweep_device_variation.toml
name = "sweep_device_variation"

[data]
path = "datasets/mnist.npz"
fetch_mnist = true          # download on first use; SHA-256 pinned
train_per_class = 100
val_per_class = 20
test_per_class = 50
seed = 0

[network]                   # 16 inputs (4x4 pixels) x 10 output neurons
grid_h = 4
grid_w = 4
n_out = 10
learn_rule = "surrogate"    # or "stdp" (device-local)
encoding = "rate"

[stdp]
pot_amp = 0.02              # write-pulse amplitudes, in the device model's drive unit
dep_amp = 0.02
sg_lr = 0.02

[device]
model = "softbound"         # any name from `neurovat devices`
write_noise = 0.0

[train]
epochs = 6

[sweep]
parameter = "device.variation.tau_w"    # relative sigma across the array
values = [0.0, 0.05, 0.1, 0.2, 0.4]
seeds = [1, 2, 3]
